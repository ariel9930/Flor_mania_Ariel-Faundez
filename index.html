<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Ariel Faundez">
    <link rel="stylesheet" href="static/css/style.css">
    <title>Flor mania</title>
</head>

<body>
    <header>
        <nav class="navbar">
            <div class="titulo">
                <h1><span class="Flor">Flor</span>Manía</h1>
            </div>
            <div class="envia-flores">
                <h2>Envia flores</h2>
                <h2>Nosotros</h2>
                <button class="iniciar-sesion">Iniciar Sesión</button>
            </div>
        </nav>
        <nav class="lista-flores">
            <a href="#">Girasoles</a>
            <a href="#">Rosas</a>
            <a href="#">Claveles</a>
            <a href="#">Tulipanes</a>
            <a href="#">Lirios</a>
            <a href="#">Orquídeas</a>
            <a href="#">Margaritas</a>
        </nav>
    </header>
    <main class="container">
        <div class="flores-mes">
            <h1>Flor del mes</h1>
            <img src="static/img/flor-del-mes.jpg" alt="flor-mes">
            <div class="separacion">
                <p>Mostrande<span class="negrita"> 50 resultados</span></p>
                <a href="#">Ver más flores</a>
            </div>
        </div>

        <section class="finales-cajas">
            <div class="caja1">
                <img src="static/img/ramo-de-rosas-Photoroom.png" alt="rosas">
                <div class="rosas-texto">
                    <div class="abajo">
                        <p><span class="ramo-rosas-texto">Ramo de Rosas</span></p>
                        <p><span class="dinero">$40.00</span></p>
                    </div>
                    <button class="Comprar">Comprar</button>
                </div>
            </div>

            <div class="caja2">
                <img src="static/img/arreglo-tulipanes-Photoroom.png" alt="tulipanes">
                <div class="tulipanes-texto">
                    <div class="abajo">
                        <p><span class="ramo-rosas-texto">Arreglo Tulipanes</span></p>
                        <p><span class="dinero">$50.00</span></p>
                    </div>
                    <button class="Comprar">Comprar</button>
                </div>
            </div>

            <div class="caja3">
                <img src="static/img/bouquet-lirios-Photoroom.png" alt="bouquet">
                <div class="bouquet-texto">
                    <div class="abajo">
                        <p><span class="ramo-rosas-texto">Bouquet Lirios</span></p>
                        <p><span class="dinero">$25.00</span></p>
                    </div>
                    <button class="Comprar">Comprar</button>
                </div>
            </div>

        </section>
    </main>
    <script src="static/js/script.js"></script>
</body>

</html>
